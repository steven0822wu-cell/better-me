<!DOCTYPE html>
<html lang="id" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Better Me</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Better Me">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;600&family=Cormorant+Garamond:wght@500;700&family=EB+Garamond:wght@400;600&family=Inter:wght@400;600;700&family=Noto+Serif+TC:wght@400;700&family=Nunito:wght@400;700&family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/fx.css">
</head>
<body class="cover-page">
  <main class="cover">
    <div class="brand cover-brand"><span class="brand-mark">BM</span><span class="brand-text">Better Me</span></div>
    <p class="muted cover-sub">Siapa yang mau jadi lebih baik hari ini?</p>

    <div class="role-grid" id="roles"><p class="muted cover-loading">Memuat…</p></div>

    <form class="card pw-card" id="pw-form" hidden>
      <p class="pw-title">Masuk sebagai <b id="pw-role"></b></p>
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
      <input type="text" name="username" autocomplete="username" hidden>
      <button class="btn btn-block" type="submit">Masuk</button>
      <button class="btn btn-ghost btn-block" type="button" id="pw-back">← Ganti role</button>
      <p class="error" id="login-error" hidden></p>
    </form>
  </main>

  <script type="module">
    import { sb } from './js/supabase.js';
    import { login } from './js/auth.js';
    import * as CFG from './js/config.js';
    import { applyCachedTheme } from './js/theme.js';
    import { buildAmbient, sticker } from './js/fx.js';
    applyCachedTheme();
    buildAmbient();

    // Sudah pernah login di perangkat ini → langsung masuk
    const { data: { session } } = await sb.auth.getSession();
    if (session) location.replace('app.html');

    const roles = document.getElementById('roles');
    const form = document.getElementById('pw-form');
    const err = document.getElementById('login-error');
    let role = null;

    let email = null;
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Daftar akun dari database (diatur Steve di Pengaturan → Personel).
    // Kalau SQL 11 belum dijalankan → pakai daftar lama di config.js
    let people = [];
    const { data, error } = await sb.rpc('login_profiles');
    if (!error && data?.length) people = data.map(p => ({ name: p.display_name, email: p.email, theme: p.theme }));
    else people = Object.entries(CFG.ROLE_EMAILS || {}).map(([name, email]) => ({ name, email, theme: name === 'Pelaa' ? 'oldmoney' : 'supercar' }));
    roles.classList.toggle('many', people.length > 2);
    roles.innerHTML = people.map((p, i) => `
      <button class="role-card" data-i="${i}" data-theme="${esc(p.theme)}" style="animation-delay:${.2 + i * .1}s">
        <span class="role-avatar">${esc([...p.name][0].toUpperCase())}</span>
        <span class="role-name">${esc(p.name)}</span>
      </button>`).join('') || '<p class="error">Belum ada akun.</p>';

    roles.querySelectorAll('.role-card').forEach(card => card.onclick = () => {
      const p = people[card.dataset.i];
      role = p.name; email = p.email;
      document.getElementById('pw-role').textContent = role;
      form.username.value = email;
      roles.hidden = true; form.hidden = false; err.hidden = true;
      form.password.value = '';
      form.password.focus();
    });

    document.getElementById('pw-back').onclick = () => {
      form.hidden = true; roles.hidden = false;
    };

    form.onsubmit = async e => {
      e.preventDefault();
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Memproses…'; err.hidden = true;
      try {
        await login(email, form.password.value);
        sticker('👋 Hai, ' + role + '!');
        setTimeout(() => location.replace('app.html'), 700);
      } catch (ex) {
        err.textContent = ex.message === 'Invalid login credentials' ? 'Password salah'
          : /banned/i.test(ex.message) ? 'Akun ini sedang dinonaktifkan' : ex.message;
        err.hidden = false;
        btn.disabled = false; btn.textContent = 'Masuk';
      }
    };
  </script>
</body>
</html>
